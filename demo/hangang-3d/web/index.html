<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title></title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.css">
<link rel="stylesheet" href="style.css?v=1101c">
</head>
<body>
<div id="map"></div>
<canvas id="fx" hidden></canvas>
<!-- 화면 글자는 모두 data/text.json(= docs/content/*.md를 build_text.py로 옮긴 것)에서 채운다. data-t = text.json 안의 자리 -->

<!-- 낮 화면: docs/content/A-04_한강지도.md -->
<section class="panel head day">
  <h1 data-t="a04.title"></h1>
  <p data-t="a04.lead"></p>
  <div class="btns">
    <button id="btn-all" type="button" data-t="a04.all"></button>
    <button id="btn-demo" type="button" data-t="a04.demo"></button>
    <button id="btn-fly" type="button"></button>
  </div>
  <label class="sel"><span data-t="a04.bridge"></span>
    <select id="sel-bridge"><option value="" data-t="a04.bridgePick"></option></select>
  </label>
  <p class="virtual" data-t="a04.virtual"></p>
</section>

<button id="btn-scene" class="scene-btn day" type="button" data-t="a04.scene"></button>

<details class="panel jobs day" open>
  <summary id="day-sum"></summary>
  <div id="day-chips" class="chips"></div>
  <div class="segs"><span class="seg" data-k="group"><button type="button" data-v="" data-t="a01.views.0.0"></button><button type="button" data-v="1" data-t="a01.views.0.1"></button></span><span class="seg" data-k="status"><button type="button" data-v="" data-t="a01.views.1.0"></button><button type="button" data-v="open" data-t="a01.views.1.1"></button><button type="button" data-v="done" data-t="a01.views.1.2"></button></span></div>
  <ol id="day-rows" class="rows"></ol>
</details>

<!-- 판정 카드(낮·밤 공용): 낮에는 오른쪽 위, 밤에는 상황판 오른쪽 칸 -->
<article id="card" class="card glass" hidden></article>

<!-- 예시: 불꽃축제 밤 상황판. docs/content/A-01_상황판.md · U-01_현장휴대폰.md · U-02_시민신고.md -->
<div id="board">
  <header class="b-head glass">
    <div class="b-title"><h1 data-t="a01.title"></h1><p data-t="a01.lead"></p></div>
    <button id="b-exit" type="button" data-t="a01.exit"></button>
    <div class="b-basis">
      <span class="tag" data-t="a01.basis.0"></span>
      <span class="tag dashed" data-t="a01.basis.1"></span>
    </div>
    <dl class="kpi">
      <div><dt id="k-n"></dt><dd data-kpi="0"></dd></div>
      <div><dt id="k-open"></dt><dd data-kpi="1"></dd></div>
      <div class="ok"><dt id="k-done"></dt><dd data-kpi="2"></dd></div>
    </dl>
    <div class="b-filter"><h2 data-t="a01.filter"></h2><p data-t="a01.filterLead"></p></div>
    <div class="b-play">
      <span class="clock"><b id="b-clock">19:00</b><i><i id="b-bar"></i></i></span>
      <button id="b-play" type="button"></button>
    </div>
    <div id="b-chips" class="chips"></div>
  </header>

  <aside class="b-side">
    <div class="phone" id="phone">
      <div class="screen">
        <section class="p-report">
          <small data-t="u02.title"></small>
          <h3 data-t="u02.lead"></h3>
          <small data-t="u02.section"></small>
          <div class="field"><small data-t="u02.fields.0"></small><span id="u-what"></span></div>
          <div class="field"><small data-t="u02.fields.1"></small><span id="u-where"></span></div>
          <div class="field"><small data-t="u02.fields.2"></small><span id="u-phone"></span></div>
          <button id="u-send" type="button" data-t="u02.send"></button>
          <p class="hint" data-t="u02.hint"></p>
          <div class="after">
            <small data-t="u02.after"></small>
            <div class="box">
              <b class="box-head" data-t="u02.afterLead"></b>
              <dl id="u-sent"></dl>
            </div>
          </div>
        </section>
        <section class="p-inbox">
          <small data-t="u01.title"></small>
          <h3 data-t="u01.lead"></h3>
          <span class="new" data-t="u01.new"></span>
          <small data-t="u01.section"></small>
          <div class="box" id="u-recv"></div>
        </section>
        <p class="foot" data-t="u02.foot"></p>
      </div>
    </div>
    <div class="notes glass">
      <p data-t="a01.playNote"></p>
      <p data-t="a01.footNote"></p>
    </div>
  </aside>

  <div class="b-mid">
    <span class="b-place glass" data-t="a01.basis.2"></span>
    <ul id="b-approved"></ul>
  </div>
  <div class="b-card-slot" id="card-slot"></div>

  <section class="b-list glass">
    <h2><span data-t="a01.list"></span> <small data-t="a01.listLead"></small><span class="segs"><span class="seg" data-k="group"><button type="button" data-v="" data-t="a01.views.0.0"></button><button type="button" data-v="1" data-t="a01.views.0.1"></button></span><span class="seg" data-k="status"><button type="button" data-v="" data-t="a01.views.1.0"></button><button type="button" data-v="open" data-t="a01.views.1.1"></button><button type="button" data-v="done" data-t="a01.views.1.2"></button></span></span><output id="b-toast"></output></h2>
    <ol id="b-rows" class="rows"></ol>
  </section>
</div>

<script src="https://unpkg.com/maplibre-gl@5.6.0/dist/maplibre-gl.js" crossorigin="anonymous"></script>
<script src="fireworks.js?v=1101b"></script>
<script src="app.js?v=1101h"></script>
</body>
</html>
