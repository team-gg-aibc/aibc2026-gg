<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>전화 걸기 (시연)</title>
<link rel="icon" href="data:,">
<style>
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0a111d; color: #c9d6ea; font: 16px/1.5 system-ui, sans-serif; }
  main { width: min(92vw, 420px); text-align: center; }
  h1 { font-size: 22px; margin: 0 0 6px; color: #fff; }
  p { margin: 6px 0; } .sub { color: #8fa0bb; font-size: 13px; }
  #d-call { margin: 22px 0 12px; width: 100%; padding: 18px; border: 0; border-radius: 14px; background: #38d6c4; color: #04121a; font-size: 20px; font-weight: 700; }
  #d-call:disabled { opacity: .4; }
  #d-state { min-height: 1.5em; font-weight: 600; color: #fff; } #d-said { min-height: 3em; }
  form { display: flex; gap: 8px; margin-top: 14px; } input { flex: 1; min-width: 0; padding: 12px; border-radius: 10px; border: 1px solid #33476a; background: #111a29; color: #fff; font-size: 16px; }
  form button { padding: 12px 14px; border-radius: 10px; border: 1px solid #33476a; background: transparent; color: #fff; font-size: 15px; }
</style>
</head>
<body>
<!-- 휴대폰에서 여는 화면: 상담 화면이 연 통화(?room=)에 이 기기의 마이크로 들어간다. 음성 스위치(CALL_VOICE=1)가 켜졌을 때만 뜻이 있다.
     가상 시연이다. 실제 민원 접수가 아니고, 말한 소리는 받아쓰기에만 쓴다. -->
<main>
  <h1>120 민원 전화 (시연)</h1>
  <p id="d-lead"></p>
  <p class="sub">가상 시연입니다. 실제 민원 접수가 아닙니다. <span id="d-stt"></span></p>
  <button type="button" id="d-call" disabled></button>
  <p id="d-state" role="status"></p>
  <p id="d-said" class="sub" aria-live="polite"></p>
  <form id="d-fake" hidden><input id="d-text" type="text" maxlength="300"><button id="d-send"></button></form>
</main>
<script src="voice.js"></script>
</body>
</html>
