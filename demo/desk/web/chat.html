<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>대화로 문의하기 (시연)</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
/* 대화로 문의하는 시민 화면 목업(11-12). 글꼴 · 색 · 폼 칸 꼴은 citizen.html을 따랐다(자주 · 파랑 · 남색). 기관 이름 · 로고는 쓰지 않는다.
   기본 판 = 「질문 초안」 카드, ?mode=cite 판 = 그 카드에 「관련 조항」 칸(AI가 채운 참고 칸: 점선 테두리 · 옅은 노랑 바탕 · 「AI 참고」 표시).
   자동으로 쓴 답은 보이지 않는다. 「정식 답변」 카드는 실선 테두리 · 남색 띠 · 「담당자 확인」 표시. 글자는 /api/text에서만 */
:root { --p: #b14487; --th: #f5f8fc; --ln: #e5e5e5; --in: #b9bec9; --tx: #222; --tx2: #4a4a4a; --tx3: #5f5f5f; --blue: #3a5bb8; --navy: #3f55ad; --ai: #7c4a03; }
* { box-sizing: border-box; }
body { margin: 0; background: #e9ebef; color: var(--tx); font: 14.5px/1.55 "Pretendard Variable", Pretendard, -apple-system, sans-serif; word-break: keep-all; }
.phone { max-width: 460px; height: 100vh; height: 100dvh; margin: 0 auto; background: #fff; box-shadow: 0 0 0 1px #d9dce2; display: flex; flex-direction: column; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
.demo { background: #222; color: #fff; font-size: 12px; text-align: center; padding: 6px 10px; margin: 0; }
.gnb { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 9px 16px; border-bottom: 1px solid var(--ln); }
.gnb b { font-size: 17px; letter-spacing: -.02em; } .gnb span { font-size: 12px; color: var(--tx3); text-align: right; }
/* 대화 */
.log { flex: 1; min-height: 0; overflow-y: auto; padding: 12px 12px 16px; background: #f4f5f8; display: flex; flex-direction: column; align-items: flex-start; gap: 8px; }
.log > * { flex-shrink: 0; }
.msg { max-width: 86%; padding: 9px 12px; border-radius: 14px; }
.msg.bot { background: #fff; border: 1px solid var(--ln); border-top-left-radius: 4px; }
.msg.me { align-self: flex-end; background: var(--navy); color: #fff; border-top-right-radius: 4px; }
.msg.plain { align-self: center; padding: 0; border: 0; background: none; }
.msg p { margin: 0 0 6px; }
.dots { display: inline-flex; gap: 3px; vertical-align: middle; margin-right: 4px; }
.dots i { width: 6px; height: 6px; border-radius: 50%; background: #7d828c; animation: blink 1.2s infinite both; }
.dots i:nth-child(2) { animation-delay: .2s; } .dots i:nth-child(3) { animation-delay: .4s; }
@keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .dots i { animation: none; } }
.chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
.chip { padding: 7px 14px; border-radius: 99px; border: 1px solid var(--navy); background: #fff; color: var(--navy); font-weight: 700; cursor: pointer; }
.chip:disabled { opacity: .5; cursor: default; }
.cnt { margin-top: 6px; font-size: 12.5px; color: var(--tx3); }
.law { color: var(--navy); font-weight: 600; text-decoration: underline; }
/* 질문 초안 카드(citizen.html의 폼 칸 꼴): 대화로 모은 값으로 채운 접수 칸 */
.msg.qd { max-width: 100%; width: 100%; padding: 0; border: 1px solid var(--in); border-radius: 6px; background: #fff; overflow: hidden; }
.qhead { padding: 10px 12px; background: var(--th); border-bottom: 1px solid var(--ln); }
.qhead b { display: block; font-size: 18px; letter-spacing: -.02em; } .qhead span { color: var(--tx2); font-size: 13px; }
.qin { padding: 0 12px 12px; }
.from { display: inline-block; margin-top: 5px; padding: 1px 8px; border: 1px solid var(--navy); border-radius: 99px; color: var(--navy); font-size: 11.5px; font-weight: 700; }
.form { border-top: 1px solid #000; margin-top: 8px; }
.tr { display: flex; border-bottom: 1px solid var(--ln); min-height: 44px; }
.th { flex: 0 0 27%; background: var(--th); padding: 10px 8px; font-weight: 500; font-size: 13.5px; display: flex; align-items: center; }
.th em { color: var(--p); font-style: normal; font-weight: 700; margin-left: 2px; }
.td { flex: 1; padding: 8px; font-size: 13.5px; min-width: 0; }
.in { width: 100%; min-height: 38px; border: 1px solid var(--in); border-radius: 3px; padding: 7px 9px; background: #fff; }
.in.ro { background: #f6f6f8; color: var(--tx2); display: flex; align-items: center; }
textarea.in { display: block; height: 84px; resize: vertical; line-height: 1.55; }
/* 관련 조항 칸(?mode=cite): AI가 채운 참고 칸임이 보이게 — 점선 테두리 · 옅은 노랑 바탕 · 「AI 참고」 표시. 조항마다 체크로 빼고, 구절은 접어 둔다 */
.tr.wide { flex-direction: column; } .tr.wide .th { flex: none; }
.rc { padding: 8px 10px; border: 1.5px dashed var(--ai); border-radius: 4px; background: #fffaf0; }
.rcnote { color: var(--ai); font-size: 12.5px; font-weight: 600; }
.ai { display: inline-block; margin-right: 6px; padding: 0 7px; border-radius: 3px; background: var(--ai); color: #fff; font-size: 11.5px; font-weight: 700; }
.rc fieldset { margin: 0; padding: 0; border: 0; min-width: 0; } .rc fieldset:disabled { opacity: .45; }
.ci { padding: 6px 0; border-top: 1px solid #ead9b8; }
.ci .law, .ci details { margin: 2px 0 0 22px; font-size: 12.5px; } .ci .law { display: inline-block; } .ci summary { cursor: pointer; color: var(--tx2); }
blockquote { margin: 4px 0 0; padding: 6px 9px; border-left: 3px solid var(--ai); background: #fff; font-size: 13px; color: #323232; }
.agree { margin-top: 10px; padding: 10px; border: 1px solid var(--in); border-radius: 3px; font-size: 12.5px; color: var(--tx2); }
.agree p { margin: 0 0 3px; }
.chk { display: flex; align-items: center; gap: 6px; margin-top: 8px; font-size: 13.5px; color: var(--tx2); cursor: pointer; }
.chk input { accent-color: var(--p); width: 16px; height: 16px; margin: 0; }
.ci .chk { margin-top: 0; align-items: flex-start; color: var(--tx); } .ci .chk input { flex: none; margin-top: 3px; }
.chk.all { padding-top: 8px; border-top: 1px solid #ead9b8; color: var(--tx); font-weight: 600; }
.err { margin: 6px 0 0 !important; padding: 8px 10px; border-radius: 3px; background: #fff4f4; border: 1px solid #f0b9b9; color: #a8221a; font-size: 13px; }
.err:empty { display: none; }
.btns { display: flex; gap: 6px; justify-content: center; margin-top: 10px; }
.btn { min-width: 92px; padding: 11px 14px; border-radius: 4px; border: 1px solid var(--in); background: #fff; font-weight: 600; font-size: 15px; cursor: pointer; }
.btn.go { background: var(--p); border-color: var(--p); color: #fff; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
/* 정식 답변 카드 */
.msg.fm { max-width: 100%; width: 100%; padding: 0; border: 2px solid var(--navy); border-radius: 6px; background: #fff; overflow: hidden; }
.fm .band { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: var(--navy); color: #fff; padding: 9px 12px; }
.fm .band b { font-size: 20px; letter-spacing: -.02em; }
.fm .ok { padding: 2px 10px; border-radius: 99px; background: #e8f5ec; color: #1b6b3c; font-weight: 700; font-size: 12.5px; white-space: nowrap; }
.kv { display: grid; grid-template-columns: 26% 1fr; margin: 0; }
.kv dt, .kv dd { margin: 0; padding: 9px 8px; border-bottom: 1px solid var(--ln); font-size: 13.5px; min-width: 0; }
.kv dt { background: var(--th); }
/* 입력 줄 */
.bar { border-top: 1px solid var(--ln); padding: 8px 12px 10px; background: #fff; }
.bar .row { display: flex; gap: 6px; margin-top: 6px; } .bar .in { flex: 1; min-width: 0; }
.sbtn { padding: 6px 10px; border-radius: 3px; border: 1px solid var(--in); background: #fff; font-size: 13px; font-weight: 600; cursor: pointer; }
[hidden] { display: none !important; }
</style>
</head>
<body>
<div class="phone">
  <p class="demo" id="c-demo"></p>
  <div class="gnb"><b id="c-gnb"></b><span id="c-who"></span></div>
  <main class="log" id="log" role="log" aria-live="polite"></main>
  <form class="bar" id="bar" hidden>
    <button type="button" class="sbtn" id="b-example"></button>
    <div class="row"><input class="in" id="msg" maxlength="3000" autocomplete="off"><button type="submit" class="btn go" id="b-send"></button></div>
  </form>
</div>
<script src="common.js"></script>
<script>
'use strict';
// 대화로 문의하기(목업). 판이 둘이다(동규가 견줘 보고 정함):
//   기본 판(질문 초안)    한 줄 → 장소 되묻기 → 「질문 초안」 카드(제목 · 장소를 넣은 글 · 민원 장소 · 구, 제목 · 내용은 고칠 수 있다) → 접수 → 「정식 답변」 카드
//   ?mode=cite(관련 조항) 같은 흐름이고 「질문 초안」 카드에 「관련 조항」 칸이 더 있다(조례 이름 · 조항 · 원문 열기 · 접힌 구절). 고른 조항을 함께 접수한다
// 시민 화면은 자동으로 쓴 답(결론 · 답 글)과 맡는 곳을 보이지도 받지도 않는다(접수 전 「예상 답변」은 만들지 않는다). 답은 담당자가 승인한 뒤 기존 /api/citizen/<번호>로만 온다.
// 되묻기 규칙과 질문 초안은 서버(POST /api/question, 관련 조항 판은 /api/cite)가 준다. 접수는 기존 /api/inquiries.
// 글자는 /api/text에서만: 새 글은 U-02_시민접수-3판.md의 「대화 …」 절, 이미 있는 칸 이름은 그 절 그대로.
// ponytail: 핵심 흐름 한 번만(새로고침하면 대화가 사라진다 · 문구 파일을 고치면 새로고침해야 바뀐다). 대화 입구를 쓰기로 정하면 그때 더한다
const CITE = new URLSearchParams(location.search).get('mode') === 'cite';
let U = null, phase = 'ask';
const st = { text: '', q: null, asked: 0 };   // 이 대화에서 모은 값: 시민이 쓴 한 줄 · 질문 초안 {title, text, loc, cites(관련 조항 판만)} · 되물은 횟수
const K = () => U('대화 문의').kv;
const DOTS = '<span class="dots" aria-hidden="true"><i></i><i></i><i></i></span>';
const paras = (t) => String(t || '').split(/\n+|(?<=다\.)\s+/).filter(Boolean);
function say(html, cls = 'bot') {
  const e = document.createElement('div'); e.className = `msg ${cls}`; e.innerHTML = html; $('log').append(e);
  e.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); return e;
}
function setPhase(p) {   // ask = 한 줄 쓰기 · place = 장소를 되물은 뒤 · 그 밖 = 입력 줄을 숨긴다(다음 걸음은 카드의 단추)
  phase = p; const on = p === 'ask' || p === 'place';
  $('bar').hidden = !on; $('b-example').hidden = p !== 'ask'; $('msg').placeholder = K()[p === 'place' ? '장소 입력 칸' : '입력 칸'];
  if (on) $('msg').focus();
}

// ---- 한 줄 → (장소 되묻기) → 질문 초안
async function ask(place) {
  setPhase('wait'); document.querySelectorAll('.chip').forEach((x) => { x.disabled = true; });
  const k = K(), w = say(DOTS), tm = CITE && setTimeout(() => { w.innerHTML = `${DOTS}${esc(U('대화 · 관련 조항').kv['찾는 중'])}`; }, 400);   // 관련 조항을 그때 찾으면 몇 초 걸린다
  let r;
  try { r = await api(CITE ? '/api/cite' : '/api/question', { text: st.text, place }); } catch { w.remove(); say(esc(k['연결 안 됨'])); return setPhase(st.asked ? 'place' : 'ask'); } finally { clearTimeout(tm); }
  if (r.ask) {   // 글에 장소가 없다(서버의 코드 규칙) → 까닭과 함께 되묻고 칩을 보인다. 장소 이름을 적어 답해도 된다
    const first = !st.asked++;
    w.innerHTML = `${esc(k[first ? '장소 되묻기' : '장소 못 찾음'])}${first ? `<div class="cnt">${esc(k['되묻는 까닭'])}</div>` : ''}<div class="chips">${r.choices.map((c) => `<button type="button" class="chip" data-place="${esc(c.id)}">${esc(c.name)}</button>`).join('')}</div><div class="cnt">${esc(k['칩 작은 글'])}</div>`;
    return setPhase('place');
  }
  w.remove(); st.q = r; showDraft();
}

// ---- 질문 초안 → 접수 → 정식 답변
function showDraft() {   // 대화로 모은 값으로 접수 칸(/api/inquiries가 받는 칸)을 채운 카드. 제목 · 내용은 고칠 수 있고, 보이는 글이 그대로 접수된다
  setPhase('card');
  const F = U('대화 · 질문 초안'), B = U('민원내용').kv, G = U('개인정보 수집·이용 동의').kv, q = st.q, from = `<span class="from">${esc(F.kv['대화에서 확인'])}</span>`;
  const ro = (name, v, mark) => `<div class="tr"><div class="th">${esc(name)}</div><div class="td"><div class="in ro">${esc(v)}</div>${mark ? from : ''}</div></div>`;
  // 관련 조항 칸(?mode=cite): 조례 이름 · 조항 · 원문 열기만, 구절은 접어 둔다. 조항마다 체크로 빼고, 「함께 보냅니다」를 끄면 조항 없이 접수된다
  const R = U('대화 · 관련 조항'), rk = R.kv, cs = q.cites || [];
  const cite = !CITE ? '' : `<div class="tr wide"><div class="th">${esc(rk['칸 이름'])}</div><div class="td"><div class="rc"><p class="rcnote"><span class="ai">${esc(rk['표시'])}</span>${esc(cs.length ? R.lead : rk['없음'])}</p>${cs.length ? `
      <fieldset id="f-citeset">${cs.map((c) => `<div class="ci"><label class="chk"><input type="checkbox" class="f-cite" value="${esc(c.label)}" checked> <span><b>${esc(c.law)}</b> ${esc(c.article)}</span></label>
        ${c.url ? `<a class="law" href="${esc(c.url)}" target="_blank" rel="noopener" title="${esc(rk['원문 열기 설명'])}">${esc(rk['원문 열기'])}</a>` : ''}${c.quotes.length ? `<details><summary>${esc(rk['구절 보기'])}</summary>${c.quotes.map((x) => `<blockquote>${esc(x)}</blockquote>`).join('')}</details>` : ''}</div>`).join('')}</fieldset>
      <label class="chk all"><input type="checkbox" id="f-withcites" checked> ${esc(rk['함께 보냄'])}</label>` : ''}</div></div></div>`;
  say(`<header class="qhead"><b>${esc(F.kv['머리'])}</b><span>${esc(F.lead)}</span></header><div class="qin"><div class="form">
    <div class="tr"><label class="th" for="f-title">${esc(B['제목'])}<em>*</em></label><div class="td"><input class="in" id="f-title" maxlength="30" value="${esc(q.title)}"></div></div>
    <div class="tr"><label class="th" for="f-text">${esc(B['내용'])}<em>*</em></label><div class="td"><textarea class="in" id="f-text" maxlength="3000">${esc(q.text)}</textarea></div></div>
    ${ro(B['민원 장소'], fill(B['부근'], { 장소: q.loc.name }), true)}${ro(B['민원발생지역'], q.loc.gu || '—', !!q.loc.gu)}${cite}</div>
    <div class="agree">${G['동의 글'].split(' / ').map((x) => `<p>${esc(x)}</p>`).join('')}</div>
    <label class="chk"><input type="checkbox" id="f-agree"> ${esc(G['동의'])}</label>
    <p class="err" id="f-err" role="alert"></p>
    <div class="btns"><button type="button" class="btn go" data-do="send">${esc(F.btn()[0])}</button></div></div>`, 'qd');
}
async function send(b) {
  const s = U('상황별 안내').tab('상황'), F = U('대화 · 질문 초안'), f = F.kv, rk = U('대화 · 관련 조항').kv, err = $('f-err'), title = $('f-title').value.trim(), text = $('f-text').value.trim(), L = st.q.loc;
  const miss = !title ? [s['제목 없음'], 'f-title'] : !text ? [s['내용 없음'], 'f-text'] : !$('f-agree').checked ? [s['동의 안 함'], 'f-agree'] : null;
  if (miss) { err.textContent = miss[0]; $(miss[1]).focus(); return; }
  err.textContent = ''; b.disabled = true; b.textContent = f['접수하는 중'];
  const body = { title, text, agree: true, region: L.gu, public: false, notify: [], loc: { lon: L.lon, lat: L.lat, how: 'chat' } };   // how: 'chat' = 시민이 대화에서 답한 장소(담당자 카드에 「시민이 대화에서 답함」)
  if (CITE) body.cites = $('f-withcites') && $('f-withcites').checked ? [...document.querySelectorAll('.f-cite:checked')].map((x) => x.value) : [];   // 체크가 남은 조항만(「함께 보냅니다」를 끄면 없음)
  let r;
  try { r = await api('/api/inquiries', body); }   // 기존 접수 길 그대로
  catch { err.textContent = f['접수하지 못함']; b.disabled = false; b.textContent = F.btn()[0]; return; }
  b.textContent = F.btn()[0]; document.querySelectorAll('.qd input, .qd textarea').forEach((x) => { x.disabled = true; });
  say(esc(fill(f['접수함'], { 번호: r.no }) + (CITE ? ` ${body.cites.length ? fill(rk['조항 함께 보냄'], { n: body.cites.length }) : rk['조항 없이 보냄']}` : '')));
  const w = say(`${DOTS}${esc(f['기다리는 중'])}`);
  const tm = setInterval(async () => {   // 기존 시민 화면과 같은 길: 승인 전에는 answer가 비어 온다
    let c; try { c = await api(`/api/citizen/${r.id}`); } catch { return; }
    if (!c.answer || !w.isConnected) return;
    clearInterval(tm); w.remove(); showFormal(c);
  }, 1500);
}
function showFormal(c) {   // 담당자가 승인한 답. 줄 이름 · 「처리담당자(시연)」 표기는 기존 시민 화면의 「받은 답」 그대로
  const F = U('대화 · 정식 답변'), k = F.kv, a = U('받은 답').kv;
  say(esc(k['도착']));
  say(`<header class="band"><b>${esc(F.lead)}</b><span class="ok">&#10003; ${esc(k['확인 표시'])}</span></header><dl class="kv">
    <dt>${esc(a['담당부서'])}</dt><dd>${esc(a['담당'])}</dd>
    <dt>${esc(a['내용'])}</dt><dd><p>1. ${esc(a['인사'])}</p>${paras(c.answer).map((p, i) => `<p>${i + 2}. ${esc(p)}</p>`).join('')}</dd>
    ${c.citations.length ? `<dt>${esc(a['관련법령'])}</dt><dd>${c.citations.map((x) => (x.url ? `<a class="law" href="${esc(x.url)}" target="_blank" rel="noopener" title="${esc(a['원문 링크'])}">${esc(x.label)}</a>` : `<span>${esc(x.label)}</span>`)).join('<br>')}<div class="cnt">${esc(a['기준'])}</div></dd>` : ''}
    <dt>${esc(a['처리 일시'])}</dt><dd>${esc(ymd(c.approved_at))} ${esc(hhmm(c.approved_at))}</dd></dl>`, 'fm');
  say(`<div class="btns"><button type="button" class="btn" data-do="new">${esc(U('대화 문의').btn(1)[0])}</button></div>`, 'plain');
}

function bind() {
  $('bar').onsubmit = (e) => {
    e.preventDefault();
    const v = $('msg').value.trim(); if (!v) return;
    $('msg').value = ''; say(esc(v), 'me');
    if (phase === 'place') return ask(v);   // 되물은 뒤: 적은 말에서 장소를 찾는다
    st.text = v; ask('');
  };
  $('b-example').onclick = () => { $('msg').value = K()['예시 글']; $('msg').focus(); };
  $('log').onchange = (e) => { if (e.target.id === 'f-withcites') $('f-citeset').disabled = !e.target.checked; };   // 「관련 조항을 함께 보냅니다」를 끄면 조항 목록을 흐리게
  $('log').onclick = (e) => {
    const b = e.target.closest('button'); if (!b || b.disabled) return;
    if (b.dataset.place) { if (phase === 'place') { say(esc(b.textContent), 'me'); ask(b.dataset.place); } }
    else if (b.dataset.do === 'send') send(b);
    else if (b.dataset.do === 'new') location.reload();
  };
}

(async function main() {
  try { U = texts((await api('/api/text')).text, 'U-02_시민접수-3판'); }   // 문구만 받는다(문의 목록 · 처리 기관 자료는 받지 않는다)
  catch { $('log').textContent = '화면을 불러오지 못했습니다. 화면 서버가 켜져 있는지 확인해 주세요.'; return; }   // ponytail: 글자 파일도 못 받은 때만 쓰는 마지막 문장(citizen.html과 같음)
  const k = K(), [bEx, bSend] = U('대화 문의').btn();
  document.title = `${k['화면 이름']} (시연)`;
  $('c-demo').textContent = k['시연']; $('c-gnb').textContent = k['화면 이름']; $('c-who').textContent = U('머리').kv['신청인'];
  $('b-example').textContent = bEx; $('b-send').textContent = bSend;
  bind(); say(esc(U('대화 문의').lead)); setPhase('ask');
})();
</script>
