     색: 사람 = GG비서 대시보드 4색, 상태 = 고정 상태 색(늘 아이콘 + 글자와 함께), 글자는 잉크색만. 외부 파일 없이 열린다. -->
<style>
  :root {
    color-scheme: light;
    --page:#F4F6F8; --card:#FFFFFF; --soft:#fafaf8; --ink:#0b0b0b; --sub:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --band:#ecebe6;
    --good:#0ca30c; --warn:#fab219; --bad:#d03b3b; --good-wash:#e7f6e7; --warn-wash:#fef3d9; --bad-wash:#fbeaea;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--page); color:var(--ink); font:15px/1.5 "Pretendard", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
         word-break:keep-all; overflow-wrap:anywhere; }
  header { padding:20px 24px 6px; }
  h1 { font-size:28px; line-height:1.2; margin:0; display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
  .chip-example { font-size:15px; background:var(--ink); color:#fff; border-radius:8px; padding:3px 10px; }
  .banner { margin:10px 0 4px; padding:10px 14px; border-radius:10px; background:var(--warn-wash); border:1px solid var(--warn); font-weight:600; }
  .meta { color:var(--sub); font-size:14px; margin:6px 0 10px; }
  .legend { display:flex; flex-wrap:wrap; gap:6px 16px; font-size:13px; color:var(--sub); align-items:center; }
  .legend span { display:inline-flex; gap:6px; align-items:center; }
  .controls { display:flex; gap:8px; margin:10px 0 0; flex-wrap:wrap; }
  .controls button { font:inherit; font-size:13px; border:1px solid var(--axis); background:var(--card); border-radius:8px; padding:4px 10px; cursor:pointer; color:var(--ink); }
  main { display:grid; grid-template-columns:minmax(0,1.45fr) minmax(300px,1fr); gap:16px; padding:8px 24px 24px; align-items:start; }
  .panel { background:var(--card); border-radius:16px; box-shadow:0 1px 3px rgba(0,0,0,.06); }
  #tree-wrap { padding:12px 12px 12px 6px; }
  #detail { position:sticky; top:12px; padding:18px; max-height:calc(100vh - 24px); overflow:auto; }
  footer { color:var(--muted); font-size:12.5px; padding:0 24px 24px; }
  @media (max-width:860px) {
    header { padding:14px 16px 4px; } h1 { font-size:24px; }
    main { grid-template-columns:minmax(0,1fr); padding:8px 16px 20px; }
    #detail { position:static; max-height:none; }
    footer { padding:0 16px 20px; }
  }
  ul.tree, ul.tree ul { list-style:none; margin:0; padding:0; }
  ul.tree ul { margin-left:13px; padding-left:12px; border-left:1px solid var(--axis); }
  ul.tree li { position:relative; margin:6px 0; }
  ul.tree ul > li::before { content:""; position:absolute; left:-12px; top:21px; width:10px; border-top:1px solid var(--axis); }
  .row { display:flex; align-items:flex-start; gap:2px; }
  .twisty { width:26px; height:26px; flex:none; margin-top:7px; border:0; background:none; border-radius:6px; cursor:pointer; color:var(--sub); font-size:13px; }
  .twisty:hover { background:var(--band); }
  .twisty.leaf { visibility:hidden; }
  .node { flex:1; min-width:0; display:grid; gap:3px; text-align:left; font:inherit; color:inherit; cursor:pointer;
          background:var(--card); border:1px solid var(--grid); border-radius:12px; padding:8px 11px; }
  .node:hover { border-color:var(--axis); }
  .node:focus-visible { outline:2px solid var(--ink); outline-offset:2px; }
  .node[aria-current="true"] { border:2px solid var(--ink); padding:7px 10px; }
  .node.candidate, .node.group { border-style:dashed; background:var(--soft); }
  .node.experiment { background:var(--soft); }
  .node.root { background:var(--band); }
  .top { display:flex; gap:6px 8px; align-items:center; flex-wrap:wrap; font-weight:700; }
  .kind { color:var(--sub); font-weight:600; }
  .sub { display:flex; gap:4px 10px; align-items:center; flex-wrap:wrap; font-size:12.5px; color:var(--sub); }
  .badge { display:inline-flex; gap:4px; align-items:center; font-size:12px; font-weight:700; color:var(--ink); border-radius:999px; padding:1px 8px; border:1px solid var(--axis); background:var(--card); white-space:nowrap; }
  .badge .ic { font-size:11px; }
  .badge.s-채택 { background:var(--good-wash); border-color:var(--good); } .badge.s-채택 .ic { color:var(--good); }
  .badge.s-버림 { background:var(--bad-wash); border-color:var(--bad); } .badge.s-버림 .ic { color:var(--bad); }
  .badge.s-보류 { background:var(--warn-wash); border-color:var(--warn); } .badge.s-보류 .ic { color:#b37800; }
  .badge.s-진행 { background:var(--card); border-color:var(--sub); } .badge.s-진행 .ic { color:var(--sub); }
  .badge.s-대기 { background:var(--soft); border-style:dashed; color:var(--sub); } .badge.s-대기 .ic { color:var(--muted); }
  .badge.base { background:var(--ink); color:#fff; border-color:var(--ink); }
  .who { display:inline-flex; gap:5px; align-items:center; white-space:nowrap; }
  .dot { width:10px; height:10px; border-radius:50%; display:inline-block; flex:none; }
  .num { font-variant-numeric:tabular-nums; font-weight:700; color:var(--ink); }
  .up { color:var(--good); } .down { color:var(--bad); }
  #detail h2 { font-size:20px; margin:0 0 6px; line-height:1.3; }
  #detail h3 { font-size:14px; color:var(--sub); margin:16px 0 6px; }
  #detail dl { display:grid; grid-template-columns:auto 1fr; gap:4px 12px; margin:10px 0 0; font-size:14px; }
  #detail dt { color:var(--sub); white-space:nowrap; } #detail dd { margin:0; }
  #detail p { margin:6px 0; } #detail ul { margin:4px 0; padding-left:18px; } #detail li { margin:3px 0; }
  #detail table { width:100%; border-collapse:collapse; font-size:13px; } #detail td, #detail th { border-bottom:1px solid var(--grid); padding:4px 6px; text-align:left; vertical-align:top; }
  #detail a { color:#1d5fb4; } .linkbtn { font:inherit; border:0; background:none; padding:0; color:#1d5fb4; text-decoration:underline; cursor:pointer; text-align:left; }
  .hint { color:var(--muted); font-size:13px; }
  /* 정적 보기(?snapshot=1): GG비서가 PNG로 찍어 디스코드 #대시보드에 올린다. 폭 1200 · 모든 가지 펼침 · 옆 칸 없음 · 마디마다 한 줄 */
  body.snapshot { width:1200px; }
  body.snapshot main { grid-template-columns:minmax(0,1fr); padding:8px 24px 16px; }
  body.snapshot #detail, body.snapshot .controls, body.snapshot .twisty { display:none; }
  body.snapshot .node { display:flex; flex-wrap:wrap; align-items:center; gap:2px 14px; padding:6px 11px; cursor:default; }
  body.snapshot .node[aria-current="true"] { border:1px solid var(--grid); padding:6px 11px; }
  body.snapshot ul.tree li { margin:4px 0; }
</style>

  if (n.kind === "root") {
    add(box, dl([["점수", h("span", {}, "dev 가중 ", h("span", {class: "num"}, n.score ?? "—"), " (" + n.label + ")")],
                   ["유형별", Object.entries(n.by_type || {}).map(([k, v]) => k + " " + v).join(" · ")],
                   ["흔들림 폭", (n.band ?? "—") + "점 — 같은 설정을 여러 번 돌린 가중 폭. 채택 기준은 이 폭의 2배 넘게 오름"],
                   ["잰 날", n.date]]));
    add(box, h("h3", {}, "링크"), h("ul", {}, Object.entries(n.links || {}).map(([k, u]) => h("li", {}, link(u, k))), n.compare ? h("li", {}, link(n.compare, "출발 판끼리 비교(흔들림 보기)")) : null));
  }
  if (n.kind === "hypothesis" || n.kind === "candidate") {
    const parent = byId.get(parentOf.get(n.id));
    add(box, dl([["담당", who(n.owner) || "아직 없음"], ["주기", n.cycle ? n.cycle + "주기" : null],
                   ["이슈", n.issue ? h("span", {}, link(n.issue_url, "#" + n.issue), n.issue_state ? " (" + (n.issue_state === "OPEN" ? "열림" : "닫힘") + ")" : "") : "아직 없음(고르면 그때 만든다)"],
                   ["PR", (n.prs || []).length ? h("span", {}, (n.prs || []).map((p, i) => [i ? " · " : "", link(p.url, "#" + p.number), " " + ({OPEN: "열림", MERGED: "병합", CLOSED: "닫힘"}[p.state] || p.state)])) : null],
                   ["나온 곳", parent ? jump(parent) : null]]));
    if (n.what) add(box, h("h3", {}, "무엇을 바꾸면"), h("p", {}, n.what));
    if (n.expect) add(box, h("h3", {}, "기대"), h("p", {}, n.expect));
    const exps = kids.filter(c => c.kind === "experiment");
    if (exps.length) add(box, h("h3", {}, "실험"), h("table", {}, h("tr", {}, h("th", {}, "실험"), h("th", {}, "점수"), h("th", {}, "상태")),
      exps.map(e => h("tr", {}, h("td", {}, jump(e), h("div", {class: "hint"}, e.label)), h("td", {}, h("span", {class: "num"}, e.score), " ", delta(e.delta) || ""), h("td", {}, badge(e.status))))));
    add(box, ...lessons(exps.flatMap(e => e.lesson || [])));
    const next = kids.filter(c => c.kind !== "experiment");
    if (next.length) add(box, h("h3", {}, "여기서 나온 다음 가설"), h("ul", {}, next.map(c => h("li", {}, jump(c), " ", badge(c.status)))));
  }
  if (n.kind === "experiment") {
    const hyp = byId.get(parentOf.get(n.id));
    add(box, dl([["가설", hyp ? jump(hyp) : null], ["담당", who(n.owner)], ["주기", n.cycle + "주기"], ["묶음", n.label + (n.repeats > 1 ? " · " + n.repeats + "회 평균" : "")],
                   [n.metric, h("span", {}, h("span", {class: "num"}, n.score), " ", delta(n.delta) || "", n.flag && n.flag !== "—" ? " · " + n.flag : "")],
                   ["켠 스위치", n.switches], ["결론", n.conclusion || "아직 없음"], ["잰 날", n.date], ["코드", n.code]]));
    add(box, ...lessons(n.lesson));
    add(box, h("h3", {}, "링크"), h("ul", {}, n.compare ? h("li", {}, link(n.compare, "기준과 문항별 비교")) : h("li", {class: "hint"}, "비교 문서 없음(python3 eval/compare.py <실행>)"),
               hyp && hyp.issue_url ? h("li", {}, link(hyp.issue_url, "이슈 #" + hyp.issue)) : null));
  }
  if (n.kind === "group") add(box, h("p", {}, "이슈가 아직 없는 후보다. 배분일에 버린 실험의 배운 점부터 읽고 여기서 다음 가설을 고른다."),
                                     h("ul", {}, kids.map(c => h("li", {}, jump(c)))));
}

function select(id, scroll) {
  const n = byId.get(id); if (!n) return;
  document.querySelectorAll('.node[aria-current="true"]').forEach(e => e.removeAttribute("aria-current"));
  expandTo(id);
  const el = document.getElementById("node-" + id); if (el) el.setAttribute("aria-current", "true");
  detail(n);
  history.replaceState(null, "", "#n-" + id);
  if (scroll && window.matchMedia("(max-width: 860px)").matches) document.getElementById("detail").scrollIntoView({behavior: "smooth", block: "start"});
}

add(document.getElementById("tree"), item(DATA.tree));
document.getElementById("meta").textContent = "뿌리는 출발 판, 가지는 가설 → 실험 → 다음 가설. 숫자는 리더보드와 같은 값 · 만든 때 " + DATA.as_of;
const leg = document.getElementById("legend");
for (const s of Object.keys(DATA.status)) add(leg, badge(s));
for (const p of Object.keys(DATA.people)) add(leg, who(p));
document.getElementById("open-all").onclick = () => document.querySelectorAll("#tree li").forEach(li => toggle(li, true));
document.getElementById("close-all").onclick = () => document.querySelectorAll("#tree li").forEach(li => li.dataset.id !== "root" && toggle(li, false));
document.getElementById("footer").textContent = "자료: 계획 표(docs/engine/plan.md 2-1 · 2-3 · 4-1절, 「부모」 칸) · 실행 요약(eval/runs) · 결론 · 배운 점 · GitHub 이슈 · PR 상태. python3 eval/board.py --tree가 만든다. holdout은 넣지 않는다.";
if (DATA.example) { document.getElementById("example-chip").hidden = false; document.getElementById("banner").hidden = false; document.title = "[예시] " + document.title; }
if (SNAPSHOT) {
  document.body.classList.add("snapshot");
  document.getElementById("meta").textContent += " · 정적 보기(모든 가지 펼침)";
  setTimeout(() => { document.documentElement.dataset.h = document.body.scrollHeight; });   // 찍는 쪽이 이 높이로 자른다
} else {
  const start = location.hash.startsWith("#n-") ? location.hash.slice(3) : "root";
  setTimeout(() => select(byId.has(start) ? start : "root", false));
}
</script>
