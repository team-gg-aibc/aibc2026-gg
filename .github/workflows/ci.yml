name: ci

# 지금 넣은 검사 세 가지(비밀값 · 엔진 출력 규격 · PR 본문). PR 본문 검사는 app/을 바꾼 PR만 화면 증거를 요구한다. 코드가 생기면(구현 시작 뒤) 코드 규칙 · 타입 · 테스트 · 빌드 job을 더한다.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  secret-scan:
    name: secret-scan
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 조직 레포는 gitleaks-action이 라이선스 키를 요구해서, oss-hub처럼 MIT 라이선스 CLI를 직접 받아 지문을 확인하고 실행한다.
      - name: gitleaks 비밀값 검사 (PR은 새 커밋만, main은 전체)
        run: |
          curl -sSL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            ./gitleaks git --no-banner --redact --log-opts="origin/${GITHUB_BASE_REF}..HEAD" .
          else
            ./gitleaks git --no-banner --redact .
          fi

  engine-contract:
    name: engine-contract
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/requirements.txt

      - name: 엔진 패키지 설치
        run: pip install -r engine/requirements.txt

      # #22 출력 규격 강제: 깨진 답 고침 · 목록 밖 라벨 빠짐 · 가짜 지연에 마감 안 규격 답 · 가짜 429에 마감 안 포기 · 동시 10문항.
      # 키 없이 가짜 업스테이지로 돈다(크레딧 0).
      - name: 출력 규격 스스로 시험
        env:
          UPSTAGE_API_KEY: ""
        run: python -m engine.contract --selftest

      # #82 곳 표(engine/flow2/places.json): 칸이 다 있고 곳 낱말이 원문 증거 구절에 있는지. 키 없이 돈다.
      - name: 곳 표 점검
        run: python -m engine.flow2.places --check

  pr-check:
    name: pr-check
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: 체크아웃
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 검사기 자체 시험
        run: python3 .github/scripts/check_pr.py --selftest

      # app/(화면 · 코드)을 바꾼 PR만 화면 증거 절을 요구하려고 바뀐 파일 목록을 넘긴다.
      - name: 바뀐 파일 목록
        run: git diff --name-only "origin/${GITHUB_BASE_REF}...HEAD" > "$RUNNER_TEMP/changed.txt"

      # PR 제목 · 본문은 ${{ }}로 명령에 직접 끼우지 않고 환경 변수로 넘긴다(명령 주입 방지, GitHub 공식 권고).
      - name: PR 제목 · 본문 양식 검사
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: CHANGED_FILES_PATH="$RUNNER_TEMP/changed.txt" python3 .github/scripts/check_pr.py
